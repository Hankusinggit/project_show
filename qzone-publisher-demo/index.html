<script>
/* ==========================================================================
 * 工具
 * ========================================================================== */
let toastTimer = null;
function toast(msg) {
  const t = $('toastEl');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function resetDemo() {
  if (!confirm('清空已发表的说说和草稿，恢复初始演示数据？')) return;
  _memPosts = [];
  clearDraft();
  state.liked.clear();
  state.myComments = {};
  renderFeed();
  toast('已重置 ✅');
}

/* ==========================================================================
 * 发布器视图注入（解耦：HTML 由模板字符串动态渲染到空容器）
 * —— 放在所有初始化之前执行，且不依赖 feed/状态栏等任何初始化：
 *    后续初始化即使抛错，发布器也完整可用
 * ========================================================================== */
$('pubLayer').innerHTML = PUB_VIEW_HTML;
$('emoPanel').innerHTML = EMO_PANEL_HTML;
/* 注入后才能引用发布器内部元素 */
editor = $('editor');
initEditorEvents();
buildEmojiGrid();

/* ========================================================================== * 初始化（错误隔离：任一环节抛错只影响自身，不拖垮其他部分）
 * ========================================================================== */
try {
  renderFeed();
} catch (e) { console.error('[boot] renderFeed:', e); window.__bootErr = String(e); }
try {
  $('meName').textContent = DATA.me.name;
  $('meBadge').textContent = DATA.me.badge;
  $('meSub').textContent = '访问总量 ' + DATA.me.visits;
  /* 头像支持填图片：DATA.me.avatar.img 填上地址就自动换成图片 */
  if (DATA.me.avatar.img) {
    const el = $('meAva');
    el.textContent = '';
    el.style.background = 'none';
    const im = document.createElement('img');
    im.src = DATA.me.avatar.img;
    im.alt = '';
    el.appendChild(im);
  }
} catch (e) { console.error('[boot] profile:', e); window.__bootErr = String(e); }

/* 状态栏显示真实时间 */
function sbTick() {
  const d = new Date();
  $('sbTime').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
sbTick();
setInterval(sbTick, 30000);

/* 状态栏电池：百分比嵌在电池内部 + 读取本机真实电量与充电状态
   未充电：浅灰填充条按电量伸缩，深色百分比文字始终可读
   充电中：填充条变绿色调 + 绿色闪电在电池内左侧
   Chrome/Edge 支持；Safari 降级为静态 80% */
(function setupBattery() {
  const fillEl = $('sbBatteryFill');
  const boltEl = $('sbBolt');
  const pctEl = $('sbPct');
  if (!fillEl) return;

  const INNER_W = 28.4;      /* 电池内部可用宽度（viewBox 单位） */

  const update = (level, charging) => {
    fillEl.setAttribute('width', Math.max(2, level * INNER_W));
    if (charging) {
      fillEl.setAttribute('fill', '#34C759');
      fillEl.setAttribute('opacity', '0.55');
    } else {
      fillEl.setAttribute('fill', 'currentColor');
      fillEl.setAttribute('opacity', '0.18');
    }
    boltEl.style.display = charging ? 'inline' : 'none';
    pctEl.textContent = Math.round(level * 100) + '%';
  };

  if ('getBattery' in navigator) {
    navigator.getBattery().then(battery => {
      update(battery.level, battery.charging);
      battery.addEventListener('levelchange', () => update(battery.level, battery.charging));
      battery.addEventListener('chargingchange', () => update(battery.level, battery.charging));
    }).catch(() => update(0.8, false));
  } else {
    update(0.8, false); /* Safari 等不支持，降级为 80% */
  }
})();

/* 顶部"好友动态"header：整个容器（含白色背景）的 opacity 跟随 scrollTop 线性插值 */
(function setupHeaderReveal() {
  const header = $('feedHeader');
  const scroller = $('screenScroll');
  if (!header || !scroller) return;
  let ticking = false;
  const update = () => {
    const y = scroller.scrollTop;
    /* 渐显区间拉长：0 → 完全透明；180px（header 快盖到第一条说说内容时）→ 完全不透明；线性插值 */
    const opacity = Math.min(1, Math.max(0, y / 180));
    header.style.opacity = opacity;
    header.style.pointerEvents = opacity > 0.5 ? 'auto' : 'none';
    ticking = false;
  };
  scroller.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }, { passive: true });
  update();
})();

/* ==========================================================================
 * 手机整机等比缩放：屏幕固定 Mate 80 Pro Max 比例（863px 高），视口不够高时
 * 用 zoom 缩小整机（布局同步缩放，比例恒定）；够高则保持原始尺寸
 * ========================================================================== */
(function fitPhone() {
  const PHONE_H = 887;   /* 机身总高：屏幕 863 + 边框 12×2 */
  function fit() {
    const phone = document.querySelector('.phone');
    if (!phone) return;
    /* 移动端（≤560px）脱壳全屏，不缩放 */
    if (window.innerWidth <= 560) { phone.style.zoom = ''; return; }
    phone.style.zoom = Math.min(1, (window.innerHeight - 48) / PHONE_H);
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
